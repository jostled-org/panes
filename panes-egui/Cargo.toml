[package]
name = "panes-egui"
version = "0.5.1"
edition = "2024"
description = "egui adapter for the panes layout engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/panes"
homepage = "https://github.com/jostled-org/panes"
keywords = ["layout", "egui", "ui", "gui"]
categories = ["gui"]

[dependencies]
panes = { version = "0.20", path = ".." }
egui = { version = "0.35", default-features = false }

[dev-dependencies]
panes = { version = "0.20", path = ".." }
rustc-hash = "2"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "convert"
harness = false

[lints]
workspace = true
