# Pedant style rules for the Sumavia workspace.
# Every crate forbids unsafe code. A fallback value (`unwrap_or`, `map_or` and their kin) hides why a value is absent,
# and `split_at` panics off a character boundary:
# absence is handled explicitly, by construction, an error or a match that names the default.
# Every other rule matches the shared global profile.

max_depth = 2
check_nested_if = true
check_if_in_match = true
check_nested_match = true
check_match_in_if = true
forbid_else = true
forbid_unsafe = true
check_dyn_return = true
check_dyn_param = true
check_vec_box_dyn = true
check_dyn_field = true
check_clone_in_loop = true
check_default_hasher = true
check_mixed_concerns = true
check_inline_tests = true

[check_naming]
enabled = true

# Forbidden attributes
[forbid_attributes]
enabled = true
patterns = [
    "allow(dead_code)",
    "allow(unused*)",
    "allow(clippy::*)",
]

# Forbidden types
[forbid_types]
enabled = true
patterns = [
    "Arc<String>",
    "Arc<Vec<*>>",
    "Box<dyn*Error*>",
]

# Forbidden calls
[forbid_calls]
enabled = true
patterns = [
    ".unwrap()",
    ".expect(*)",
    ".unwrap_or(*)",
    ".unwrap_or_else(*)",
    ".unwrap_or_default()",
    ".map_or(*)",
    ".map_or_else(*)",
    ".split_at(*)",
]

# Forbidden macros
[forbid_macros]
enabled = true
patterns = [
    "panic!",
    "todo!",
    "unimplemented!",
    "dbg!",
    "println!",
    "eprintln!",
]

# Relax rules for tests
[overrides."tests/**"]
max_depth = 5

[overrides."tests/**".forbid_calls]
enabled = false

[overrides."tests/**".forbid_macros]
enabled = false

[overrides."**/tests/**"]
max_depth = 5

[overrides."**/tests/**".forbid_calls]
enabled = false

[overrides."**/tests/**".forbid_macros]
enabled = false

[overrides."**/test_*.rs"]
max_depth = 5

[overrides."**/test_*.rs".forbid_calls]
enabled = false

[overrides."**/test_*.rs".forbid_macros]
enabled = false

[overrides."**/tests.rs"]
max_depth = 5

[overrides."**/tests.rs".forbid_calls]
enabled = false

[overrides."**/tests.rs".forbid_macros]
enabled = false

# Skip generated code entirely
[overrides."**/generated.rs"]
enabled = false

[overrides."target/**"]
enabled = false

# Relax rules for benchmarks: they measure, so they unwrap and print.
[overrides."**/benches/**"]
max_depth = 5

[overrides."**/benches/**".forbid_calls]
enabled = false

[overrides."**/benches/**".forbid_macros]
enabled = false

# Clippy denies unwrap_used and panic workspace-wide, and clippy.toml's
# test exemptions do not reach benches, so benches keep allow(clippy::*).
[overrides."**/benches/**".forbid_attributes]
enabled = false

# Project-specific overrides

# PanelIdGenerator generates PanelId; Constraints configures panels.
# Both are panel concerns — structural connection is through PanelId,
# which pedant can't trace through newtypes.
[overrides."**/src/panel.rs"]
check_mixed_concerns = false

# PanelEntry is a resolver output type — same domain as ResolvedLayout.
# x, y are spatial coordinates in layout resolution.
[overrides."**/src/resolver.rs"]
check_mixed_concerns = false
[overrides."**/src/resolver.rs".check_naming]
enabled = false

# x, y are spatial coordinates in overlay positioning.
[overrides."**/src/overlay/builder.rs"]
check_mixed_concerns = false
[overrides."**/src/overlay/builder.rs".check_naming]
enabled = false

[overrides."**/src/overlay/resolve.rs".check_naming]
enabled = false

# OverlayEntry is an overlay output type — same domain as OverlayDef/OverlayAnchor.
[overrides."**/src/overlay/types.rs"]
check_mixed_concerns = false

# GridColumnMode configures StrategyKind dashboard variants — same domain.
[overrides."**/src/strategy/types.rs"]
check_mixed_concerns = false

# LayoutDiff and OverlayDiff are both frame-to-frame diff types — same concern.
[overrides."**/src/diff.rs"]
check_mixed_concerns = false

# ContainerCtx is the builder's internal cursor — same concern as LayoutBuilder.
# This pattern must not match overlay/builder.rs (handled above).
[overrides."src/builder.rs"]
check_mixed_concerns = false

# WASM JSON DTOs: all serialization types for the JS boundary.
# Groups are disconnected because they serve different endpoints
# (panels, diffs, boundaries, failures) but share the same concern.
[overrides."**/src/json_types.rs"]
check_mixed_concerns = false
