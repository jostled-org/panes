# PanelIdGenerator generates PanelId; Constraints configures panels.
# Both are panel concerns — structural connection is through PanelId,
# which pedant can't trace through newtypes.
[overrides."**/panel.rs"]
check_mixed_concerns = false

# x, y are the domain names for spatial coordinates in a layout engine.
# result refers to CompileResult — not generic.
[overrides."**/resolver.rs"]
check_generic_naming = false
