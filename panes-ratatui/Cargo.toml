[package]
name = "panes-ratatui"
version = "0.3.3"
edition = "2024"
description = "Ratatui adapter for the panes layout engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/panes"
homepage = "https://github.com/jostled-org/panes"
keywords = ["layout", "ratatui", "tui", "terminal"]
categories = ["gui"]

[dependencies]
panes = { version = "0.7", path = ".." }
ratatui = { version = "0.30", default-features = false }
rustc-hash = "2"

[dev-dependencies]
panes = { version = "0.7", path = ".." }
rustc-hash = "2"

[lints]
workspace = true
