[package]
name = "panes-ratatui"
version = "0.4.12"
edition = "2024"
description = "Ratatui adapter for the panes layout engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/panes"
homepage = "https://github.com/jostled-org/panes"
keywords = ["layout", "ratatui", "tui", "terminal"]
categories = ["gui"]

[dependencies]
panes = { version = "0.18", path = ".." }
ratatui = { version = "0.30", default-features = false }

[dev-dependencies]
panes = { version = "0.18", path = ".." }
rustc-hash = "2"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "convert"
harness = false

[lints]
workspace = true
