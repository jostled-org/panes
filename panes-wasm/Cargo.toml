[package]
name = "panes-wasm"
version = "0.6.0"
edition = "2024"
description = "WASM/canvas adapter for the panes layout engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/panes"
homepage = "https://github.com/jostled-org/panes"
keywords = ["layout", "wasm", "canvas", "webassembly"]
categories = ["gui", "wasm"]

[dependencies]
panes = { version = "0.19", path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
js = ["wasm-bindgen"]

[dev-dependencies]
panes = { version = "0.19", path = ".." }
rustc-hash = "2"
serde_json = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "convert"
harness = false

[lints]
workspace = true
