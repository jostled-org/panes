[package]
name = "panes-css"
version = "0.8.0"
edition = "2024"
description = "CSS transpiler for the panes layout engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/panes"
homepage = "https://github.com/jostled-org/panes"
keywords = ["layout", "css", "flexbox", "grid"]
categories = ["gui", "web-programming"]

[dependencies]
panes = { version = "0.19", path = ".." }
taffy = { version = "0.10", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "emit"
harness = false

[lints]
workspace = true
